name: atelier
description: "A professional tailor management app for managing customers and their orders."

# Prevent accidental publishing
publish_to: "none"

# App version - updated to 2.1.0
version: 2.0.1+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  flutter_staggered_grid_view: ^0.7.0
  flutter_lucide: ^1.11.0
  # State Management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4

  # Database & Storage
  sqflite: ^2.4.1
  path: ^1.9.1
  path_provider: ^2.1.5
  archive: ^4.0.9
  shared_preferences: ^2.5.5

  # Image Handling
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  share_plus: ^12.0.2
  flutter_image_compress: ^2.4.0

  # Permissions & Contacts
  permission_handler: ^11.3.1
  flutter_native_contact_picker: ^0.0.10
  url_launcher: ^6.3.2
  photo_view: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Regular.otf
        - asset: assets/fonts/Satoshi-Bold.otf
          weight: 700

    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond-Bold.ttf
          weight: 700
